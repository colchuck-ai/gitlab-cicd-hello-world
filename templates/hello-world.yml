spec:
  inputs:
    name:
      type: string
      description: "the name of the bot saying hello world"
      default: "Hal"
---
.hello-world:
  script:
    - |
      cat > greeting.txt << EOF
      Hello world! My name is $[[ inputs.name ]]!
               __
       _(\    |@@|
      (__/\__ \--/ __
         \___|----|  |   __
             \ }{ /\ )_ / _\\
             /\__/\ \__O (__
            (--/\--)    \__/
            _)(  )(_
           `---''---`
      EOF
    - cat greeting.txt
