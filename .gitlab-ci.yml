include:
  - local: templates/hello-world.yml
  - component: ${CI_SERVER_FQDN}/engineering/dev-tools/internal/gitlab-cicd-workflow/workflow@1
  - component: ${CI_SERVER_FQDN}/engineering/dev-tools/internal/gitlab-cicd-workflow/run-if-protected@1

stages:
  - greeting
  - release

default:
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/node:20
  before_script:
    - npm config set -- //${CI_SERVER_HOST}/api/v4/groups/1234/-/packages/npm/:_authToken=${ENGINEERING_DEV_TOOLS_INTERNAL_DEPLOY_PASSWORD}
    - npm config set @engineering:registry=https://${CI_SERVER_HOST}/api/v4/groups/1234/-/packages/npm/
    - npm install

greeting:
  stage: greeting
  extends:
    - .hello-world

release:
  stage: release
  extends:
    - .run-if-protected
  script:
    - npx semantic-release
